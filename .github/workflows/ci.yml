name: CI

on:
  push:
    branches:
      - develop
      - version-15
      - version-16
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-slack_bridge-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server (Frappe ${{ matrix.frappe-branch }})

    strategy:
      fail-fast: false
      matrix:
        # The app ships one codebase for both supported Frappe majors.
        include:
          # frappe version-16 pins requires-python to >=3.14,<3.15
          - frappe-branch: version-16
            python-version: '3.14'

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.frappe-branch }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.frappe-branch }}-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          # dev headers + pkg-config: mysqlclient has no Linux wheels and builds from source
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch ${{ matrix.frappe-branch }} \
            --python "$(which python)" ~/frappe-bench

      - name: Install app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app slack_bridge $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app slack_bridge
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app slack_bridge
        env:
          TYPE: server
